name: Build Windows Portable

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".\backend[dev]"
          python -m pip install pyinstaller

      - name: Package Windows Build
        shell: pwsh
        run: |
          .\build-windows.ps1

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: spotify-music-quiz-windows-portable
          path: build/spotify-quiz-portable-*.zip
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/spotify-quiz-portable-*.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rolling build for the Releases sidebar: every push to main rewrites the
      # `latest` tag, replaces its assets and keeps it marked as "Latest".
      - name: Publish rolling "latest" release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest Windows Portable Build
          body: |
            Automatischer Windows-Portable-Build vom letzten Commit auf `main`.

            - Commit: ${{ github.sha }}
            - Build: ${{ github.run_number }}
          files: build/spotify-quiz-portable-*.zip
          # Otherwise every dated zip piles up on the same release.
          clean_release_assets: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
