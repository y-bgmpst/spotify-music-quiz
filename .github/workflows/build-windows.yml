name: Build Windows Portable

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history + tags are required to diff against the previous
          # rolling "latest" release when generating release notes.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".\backend[dev]"
          python -m pip install pyinstaller

      - name: Package Windows Build
        shell: pwsh
        run: |
          .\build-windows.ps1

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: spotify-music-quiz-windows-portable
          path: build/spotify-quiz-portable-*.zip
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/spotify-quiz-portable-*.zip
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Collects the commits between the commit of the previous rolling build
      # and the current one, grouped by Conventional-Commit type.
      - name: Generate release notes (main)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --tags --force --quiet

          $previous = ''
          $tagSha = (gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/latest" --jq '.object.sha')
          if ($LASTEXITCODE -ne 0) { $tagSha = '' }
          if ($tagSha) {
            # Annotated tags point at a tag object, resolve it to the commit.
            $resolved = (git rev-parse --verify --quiet "$tagSha^{commit}")
            if ($LASTEXITCODE -eq 0 -and $resolved) { $previous = $resolved.Trim() }
          }

          if ($previous -and $previous -ne $env:GITHUB_SHA) {
            $range = "$previous..$env:GITHUB_SHA"
          } else {
            $range = "$env:GITHUB_SHA~20..$env:GITHUB_SHA"
            if (-not (git rev-parse --verify --quiet "$env:GITHUB_SHA~20")) {
              $range = $env:GITHUB_SHA
            }
          }

          $commits = @(git log --no-merges --pretty=format:'%H%x1f%s' $range | Where-Object { $_ })

          $groups = [ordered]@{
            'Features'      = @()
            'Bugfixes'      = @()
            'Performance'   = @()
            'Dokumentation' = @()
            'Tests & CI'    = @()
            'Sonstiges'     = @()
          }

          foreach ($line in $commits) {
            $parts = $line -split "`u{001f}"
            $sha = $parts[0].Substring(0, 7)
            $subject = $parts[1]
            $key = switch -Regex ($subject) {
              '^feat(\(|!|:)'                { 'Features'; break }
              '^fix(\(|!|:)'                 { 'Bugfixes'; break }
              '^perf(\(|!|:)'                { 'Performance'; break }
              '^docs(\(|!|:)'                { 'Dokumentation'; break }
              '^(test|ci|build|chore)(\(|!|:)' { 'Tests & CI'; break }
              default                        { 'Sonstiges' }
            }
            $groups[$key] += "- $subject (``$sha``)"
          }

          $lines = @()
          $lines += 'Automatischer Windows-Portable-Build vom letzten Commit auf `main`.'
          $lines += ''
          $lines += '## Wichtigste Änderungen seit dem letzten Build'
          $lines += ''
          if ($commits.Count -eq 0) {
            $lines += '_Keine neuen Commits seit dem letzten Build._'
          } else {
            foreach ($key in $groups.Keys) {
              if ($groups[$key].Count -gt 0) {
                $lines += "### $key"
                $lines += $groups[$key]
                $lines += ''
              }
            }
          }
          $lines += '---'
          $lines += ''
          $lines += "- Commit: $env:GITHUB_SHA"
          $lines += "- Build: $env:GITHUB_RUN_NUMBER"
          if ($previous) {
            $lines += "- Vergleich: https://github.com/$env:GITHUB_REPOSITORY/compare/$previous...$env:GITHUB_SHA"
          }

          $notes = ($lines -join "`n")
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
          Write-Host $notes

      # Rolling build for the Releases sidebar: every push to main rewrites the
      # `latest` tag, replaces its assets and keeps it marked as "Latest".
      - name: Publish rolling "latest" release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest Windows Portable Build
          body_path: release-notes.md
          files: build/spotify-quiz-portable-*.zip
          # Otherwise every dated zip piles up on the same release.
          clean_release_assets: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
