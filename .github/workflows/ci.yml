name: verify
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: make setup
      - run: make verify
