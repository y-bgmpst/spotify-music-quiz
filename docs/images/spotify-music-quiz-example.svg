<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Spotify Music Quiz example screen</title>
<desc id="desc">Windows 95 and Netscape inspired quiz interface showing a concealed track, timer and team scoreboard with fake demo data.</desc>
<style>
text{font-family:Tahoma,"Segoe UI",sans-serif;fill:#000}.small{font-size:13px}.normal{font-size:16px}.bold{font-weight:700}.white{fill:#fff}.mono{font-family:monospace}.line{stroke:#808080;stroke-width:1}.out{fill:#c0c0c0;stroke:#fff;stroke-width:3}.in{fill:#fff;stroke:#606060;stroke-width:3}.btn{fill:#c0c0c0;stroke:#fff;stroke-width:3}.panel{fill:#d9d9d9;stroke:#606060;stroke-width:3}
</style>
